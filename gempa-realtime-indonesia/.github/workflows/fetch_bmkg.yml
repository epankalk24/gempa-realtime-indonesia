name: Fetch BMKG Earthquake Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch-and-store:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Memberi tahu pip di mana requirements.txt berada
      - name: Install dependencies
        working-directory: gempa-realtime-indonesia
        run: pip install -r requirements.txt

      - name: Write Google credentials from secret
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > gempa-realtime-indonesia/credentials.json

      # Memberi tahu Python di mana main.py berada
      - name: Run BMKG data pipeline
        working-directory: gempa-realtime-indonesia
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python main.py

      - name: Remove credentials file
        if: always()
        run: rm -f gempa-realtime-indonesia/credentials.json