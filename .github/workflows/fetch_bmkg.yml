name: Fetch BMKG Earthquake Data

# Kapan workflow ini berjalan:
#   1. Otomatis setiap 3 jam pada menit ke-1 UTC
#   2. Bisa dijalankan manual (workflow_dispatch)

on:
  schedule:
    - cron: '1 */3 * * *'
  workflow_dispatch:

jobs:
  fetch-and-store:
    runs-on: ubuntu-latest

    # [PENTING] Blok permissions wajib ditambahkan agar skrip pembuat Issue tidak diblokir
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google credentials from secret
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Run BMKG data pipeline
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python main.py # Pastikan file ini mengeksekusi gempaterkini.json & gempadirasakan.json saja

      - name: Remove credentials file
        if: always()
        run: rm -f credentials.json

      # Langkah notifikasi jika terjadi kegagalan pada step-step sebelumnya
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 [PIPELINE FAILURE] Eksekusi GHA Gagal pada ${new Date().toISOString().split('T')[0]}`,
              body: `**GitHub Actions gagal mengeksekusi pipeline data gempa BMKG.**\n\n🔍 **Cek log detail di sini:**\n${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n*Segera periksa log untuk memastikan tidak ada data historis yang terlewat.*`,
              labels: ['bug', 'pipeline-error']
            })
